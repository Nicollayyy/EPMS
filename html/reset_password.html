<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Reset Password | 1028 Café Management System</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./../css/login.css">
</head>
<body>
    <main class="card">
        <div class="logo-section">
            <div class="logo">
                <i class="fas fa-lock"></i>
            </div>
            <h1>Reset Password</h1>
            <p class="subtitle">1028 Café Management System</p>
        </div>

        <div class="login-section">
            <h2>Create New Password</h2>
            <p class="login-subtitle">Enter your new password below</p>

            <div id="errorMessage" class="error-message" style="display: none;"></div>

            <form method="POST" action="./../reset_password.php" id="resetForm" novalidate>
                <div class="field">
                    <label for="new_password">
                        <i class="fas fa-key"></i>
                        New Password
                    </label>
                    <div class="toggle-wrap">
                        <input id="new_password" name="new_password" type="password" placeholder="Enter new password" required autocomplete="new-password" />
                        <button type="button" class="toggle-show" id="showBtn1" aria-label="Toggle password visibility">
                            <i class="fa-solid fa-eye"></i>
                        </button>
                    </div>
                    <div class="field-error" id="new_passwordError"></div>
                </div>

                <div class="field">
                    <label for="confirm_password">
                        <i class="fas fa-check-circle"></i>
                        Confirm Password
                    </label>
                    <div class="toggle-wrap">
                        <input id="confirm_password" name="confirm_password" type="password" placeholder="Confirm new password" required autocomplete="new-password" />
                        <button type="button" class="toggle-show" id="showBtn2" aria-label="Toggle password visibility">
                            <i class="fa-solid fa-eye"></i>
                        </button>
                    </div>
                    <div class="field-error" id="confirm_passwordError"></div>
                </div>

                <div class="password-strength" id="passwordStrength" style="display: none;">
                    <div class="strength-bar">
                        <div class="strength-fill" id="strengthFill"></div>
                    </div>
                    <p class="strength-text" id="strengthText"></p>
                </div>

                <button class="btn" type="submit" name="reset_password" id="resetBtn">
                    <span class="btn-text">Reset Password</span>
                    <i class="fas fa-spinner fa-spin" id="loadingSpinner" style="display: none;"></i>
                </button>
                
                <div style="text-align: center; margin-top: 20px;">
                    <a class="link" href="./login.html">
                        <i class="fas fa-arrow-left" style="margin-right: 6px;"></i>
                        Back to Login
                    </a>
                </div>
            </form>

            <div class="footer-text">
                <p>© 2024 1028 Café. All rights reserved.</p>
            </div>
        </div>
    </main>

    <script>
        const form = document.getElementById('resetForm');
        const newPasswordInput = document.getElementById('new_password');
        const confirmPasswordInput = document.getElementById('confirm_password');
        const resetBtn = document.getElementById('resetBtn');
        const loadingSpinner = document.getElementById('loadingSpinner');
        const btnText = document.querySelector('.btn-text');
        const passwordStrength = document.getElementById('passwordStrength');
        const strengthFill = document.getElementById('strengthFill');
        const strengthText = document.getElementById('strengthText');

        // Password visibility toggles
        function setupPasswordToggle(inputId, buttonId) {
            const input = document.getElementById(inputId);
            const button = document.getElementById(buttonId);
            const icon = button.querySelector('i');

            button.addEventListener('click', () => {
                if (input.type === 'password') {
                    input.type = 'text';
                    icon.className = 'fa-solid fa-eye-slash';
                    button.setAttribute('aria-label', 'Hide password');
                } else {
                    input.type = 'password';
                    icon.className = 'fa-solid fa-eye';
                    button.setAttribute('aria-label', 'Show password');
                }
            });
        }

        setupPasswordToggle('new_password', 'showBtn1');
        setupPasswordToggle('confirm_password', 'showBtn2');

        function showError(fieldId, message) {
            const errorElement = document.getElementById(fieldId + 'Error');
            const inputElement = document.getElementById(fieldId);
            errorElement.textContent = message;
            errorElement.style.display = 'block';
            inputElement.classList.add('error');
        }

        function clearError(fieldId) {
            const errorElement = document.getElementById(fieldId + 'Error');
            const inputElement = document.getElementById(fieldId);
            errorElement.style.display = 'none';
            inputElement.classList.remove('error');
        }

        function checkPasswordStrength(password) {
            let strength = 0;
            let feedback = [];

            if (password.length >= 8) strength += 1;
            else feedback.push('at least 8 characters');

            if (/[a-z]/.test(password)) strength += 1;
            else feedback.push('lowercase letter');

            if (/[A-Z]/.test(password)) strength += 1;
            else feedback.push('uppercase letter');

            if (/[0-9]/.test(password)) strength += 1;
            else feedback.push('number');

            if (/[^A-Za-z0-9]/.test(password)) strength += 1;
            else feedback.push('special character');

            return { strength, feedback };
        }

        function updatePasswordStrength(password) {
            if (!password) {
                passwordStrength.style.display = 'none';
                return;
            }

            const { strength, feedback } = checkPasswordStrength(password);
            passwordStrength.style.display = 'block';

            const percentage = (strength / 5) * 100;
            strengthFill.style.width = percentage + '%';

            let color, text;
            if (strength <= 2) {
                color = '#ef4444';
                text = 'Weak';
            } else if (strength <= 3) {
                color = '#f59e0b';
                text = 'Fair';
            } else if (strength <= 4) {
                color = '#10b981';
                text = 'Good';
            } else {
                color = '#059669';
                text = 'Strong';
            }

            strengthFill.style.backgroundColor = color;
            strengthText.textContent = text;
            strengthText.style.color = color;
        }

        function validateForm() {
            let isValid = true;
            clearError('new_password');
            clearError('confirm_password');

            const newPassword = newPasswordInput.value;
            const confirmPassword = confirmPasswordInput.value;

            if (!newPassword) {
                showError('new_password', 'New password is required');
                isValid = false;
            } else if (newPassword.length < 8) {
                showError('new_password', 'Password must be at least 8 characters');
                isValid = false;
            }

            if (!confirmPassword) {
                showError('confirm_password', 'Please confirm your password');
                isValid = false;
            } else if (newPassword !== confirmPassword) {
                showError('confirm_password', 'Passwords do not match');
                isValid = false;
            }

            return isValid;
        }

        newPasswordInput.addEventListener('input', () => {
            updatePasswordStrength(newPasswordInput.value);
            if (newPasswordInput.value) {
                clearError('new_password');
            }
        });

        confirmPasswordInput.addEventListener('input', () => {
            if (confirmPasswordInput.value) {
                clearError('confirm_password');
            }
        });

        form.addEventListener('submit', (e) => {
            if (!validateForm()) {
                e.preventDefault();
                return false;
            }
            
            resetBtn.disabled = true;
            btnText.style.display = 'none';
            loadingSpinner.style.display = 'inline-block';
        });

        // Check for URL parameters to show errors
        const urlParams = new URLSearchParams(window.location.search);
        const error = urlParams.get('error');
        if (error) {
            const errorMessage = document.getElementById('errorMessage');
            let message = '';
            
            switch(error) {
                case 'password_mismatch':
                    message = 'Passwords do not match. Please try again.';
                    break;
                case 'weak_password':
                    message = 'Password is too weak. Please choose a stronger password.';
                    break;
                case 'access_denied':
                    message = 'Access denied. Please verify OTP first.';
                    break;
                default:
                    message = 'An error occurred. Please try again.';
            }
            
            errorMessage.textContent = message;
            errorMessage.style.display = 'block';
        }
    </script>
</body>
</html>
