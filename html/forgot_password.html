<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Forgot Password | 1028 Café Management System</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./../css/login.css">
</head>
<body>
    <main class="card">
        <div class="logo-section">
            <div class="logo">
                <i class="fas fa-key"></i>
            </div>
            <h1>Password Recovery</h1>
            <p class="subtitle">1028 Café Management System</p>
        </div>

        <div class="login-section">
            <h2>Forgot Your Password?</h2>
            <p class="login-subtitle">Enter your registered phone number to receive an OTP</p>

            <div id="errorMessage" class="error-message" style="display: none;"></div>

            <form method="POST" action="../forgot_password.php">
                <div class="field">
                    <label for="phone">
                        <i class="fas fa-phone"></i>
                        Phone Number
                    </label>
                    <input id="phone" name="phone" type="tel" placeholder="Enter your phone number" required />
                </div>

                <button class="btn" type="submit" name="send_otp">
                    Send OTP
                </button>
                
                <div style="text-align: center; margin-top: 20px;">
                    <a class="link" href="./login.html">
                        <i class="fas fa-arrow-left" style="margin-right: 6px;"></i>
                        Back to Login
                    </a>
                </div>
            </form>

            <div class="footer-text">
                <p>© 2024 1028 Café. All rights reserved.</p>
            </div>
        </div>
    </main>

    <script>
        // Show error messages from URL
        const urlParams = new URLSearchParams(window.location.search);
        const error = urlParams.get('error');
        
        if (error) {
            const errorMessage = document.getElementById('errorMessage');
            let message = '';
            
            switch(error) {
                case 'phone_not_found':
                    message = 'Phone number not found in our system.';
                    break;
                case 'sms_failed':
                    message = 'Failed to send OTP. Please try again.';
                    break;
                case 'invalid_phone':
                    message = 'Please enter a valid phone number.';
                    break;
                default:
                    message = 'An error occurred. Please try again.';
            }
            
            errorMessage.textContent = message;
            errorMessage.style.display = 'block';
        }
    </script>
</body>
</html>
