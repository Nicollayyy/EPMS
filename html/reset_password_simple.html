<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Reset Password | 1028 Café Management System</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./../css/login.css">
</head>
<body>
    <main class="card">
        <div class="logo-section">
            <div class="logo">
                <i class="fas fa-lock"></i>
            </div>
            <h1>Reset Password</h1>
            <p class="subtitle">1028 Café Management System</p>
        </div>

        <div class="login-section">
            <h2>Create New Password</h2>
            <p class="login-subtitle">Enter your new password below</p>

            <div id="errorMessage" class="error-message" style="display: none;"></div>

            <form method="POST" action="../reset_password.php">
                <div class="field">
                    <label for="new_password">
                        <i class="fas fa-key"></i>
                        New Password
                    </label>
                    <div class="toggle-wrap">
                        <input id="new_password" name="new_password" type="password" placeholder="Enter new password" required />
                        <button type="button" class="toggle-show" id="showBtn1">
                            <i class="fa-solid fa-eye"></i>
                        </button>
                    </div>
                </div>

                <div class="field">
                    <label for="confirm_password">
                        <i class="fas fa-check-circle"></i>
                        Confirm Password
                    </label>
                    <div class="toggle-wrap">
                        <input id="confirm_password" name="confirm_password" type="password" placeholder="Confirm new password" required />
                        <button type="button" class="toggle-show" id="showBtn2">
                            <i class="fa-solid fa-eye"></i>
                        </button>
                    </div>
                </div>

                <button class="btn" type="submit" name="reset_password">
                    Reset Password
                </button>
                
                <div style="text-align: center; margin-top: 20px;">
                    <a class="link" href="./login.html">
                        <i class="fas fa-arrow-left" style="margin-right: 6px;"></i>
                        Back to Login
                    </a>
                </div>
            </form>

            <div class="footer-text">
                <p>© 2024 1028 Café. All rights reserved.</p>
            </div>
        </div>
    </main>

    <script>
        // Password visibility toggles
        function setupToggle(inputId, btnId) {
            const input = document.getElementById(inputId);
            const btn = document.getElementById(btnId);
            const icon = btn.querySelector('i');

            btn.addEventListener('click', () => {
                if (input.type === 'password') {
                    input.type = 'text';
                    icon.className = 'fa-solid fa-eye-slash';
                } else {
                    input.type = 'password';
                    icon.className = 'fa-solid fa-eye';
                }
            });
        }

        setupToggle('new_password', 'showBtn1');
        setupToggle('confirm_password', 'showBtn2');

        // Show error messages
        const urlParams = new URLSearchParams(window.location.search);
        const error = urlParams.get('error');
        if (error) {
            const errorMessage = document.getElementById('errorMessage');
            let message = '';
            
            switch(error) {
                case 'password_mismatch':
                    message = 'Passwords do not match. Please try again.';
                    break;
                case 'weak_password':
                    message = 'Password is too weak. Please choose a stronger password.';
                    break;
                case 'access_denied':
                    message = 'Access denied. Please verify OTP first.';
                    break;
                default:
                    message = 'An error occurred. Please try again.';
            }
            
            errorMessage.textContent = message;
            errorMessage.style.display = 'block';
        }
    </script>
</body>
</html>
