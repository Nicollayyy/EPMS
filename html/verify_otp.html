<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Verify OTP | 1028 Café Management System</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./../css/login.css">
</head>
<body>
    <main class="card">
        <div class="logo-section">
            <div class="logo">
                <i class="fas fa-shield-alt"></i>
            </div>
            <h1>Verify OTP</h1>
            <p class="subtitle">1028 Café Management System</p>
        </div>

        <div class="login-section">
            <h2>Enter Verification Code</h2>
            <p class="login-subtitle">We sent a 6-digit code to your registered number</p>

            <div id="errorMessage" class="error-message" style="display: none;"></div>

            <form method="POST" action="./../verify_otp.php" id="otpForm" novalidate>
                <div class="field">
                    <label for="otp">
                        <i class="fas fa-key"></i>
                        OTP Code
                    </label>
                    <input id="otp" name="otp" type="text" placeholder="Enter 6-digit OTP" maxlength="6" required autocomplete="one-time-code" />
                    <div class="field-error" id="otpError"></div>
                </div>

                <button class="btn" type="submit" name="verify_otp" id="verifyBtn">
                    <span class="btn-text">Verify OTP</span>
                    <i class="fas fa-spinner fa-spin" id="loadingSpinner" style="display: none;"></i>
                </button>
                
                <div style="text-align: center; margin-top: 20px; display: flex; flex-direction: column; gap: 12px;">
                    <a class="link" href="./forgot_password.html">
                        <i class="fas fa-redo" style="margin-right: 6px;"></i>
                        Resend OTP
                    </a>
                    <a class="link" href="./login.html" style="color: var(--text-light);">
                        <i class="fas fa-arrow-left" style="margin-right: 6px;"></i>
                        Back to Login
                    </a>
                </div>
            </form>

            <div class="footer-text">
                <p>© 2024 1028 Café. All rights reserved.</p>
            </div>
        </div>
    </main>

    <script>
        const form = document.getElementById('otpForm');
        const otpInput = document.getElementById('otp');
        const verifyBtn = document.getElementById('verifyBtn');
        const loadingSpinner = document.getElementById('loadingSpinner');
        const btnText = document.querySelector('.btn-text');

        function showError(fieldId, message) {
            const errorElement = document.getElementById(fieldId + 'Error');
            const inputElement = document.getElementById(fieldId);
            errorElement.textContent = message;
            errorElement.style.display = 'block';
            inputElement.classList.add('error');
        }

        function clearError(fieldId) {
            const errorElement = document.getElementById(fieldId + 'Error');
            const inputElement = document.getElementById(fieldId);
            errorElement.style.display = 'none';
            inputElement.classList.remove('error');
        }

        function validateForm() {
            let isValid = true;
            clearError('otp');

            const otp = otpInput.value.trim();
            
            if (!otp) {
                showError('otp', 'OTP code is required');
                isValid = false;
            } else if (otp.length !== 6 || !/^\d{6}$/.test(otp)) {
                showError('otp', 'Please enter a valid 6-digit OTP');
                isValid = false;
            }

            return isValid;
        }

        // Only allow numbers in OTP input
        otpInput.addEventListener('input', (e) => {
            e.target.value = e.target.value.replace(/[^0-9]/g, '');
            if (otpInput.value.trim()) {
                clearError('otp');
            }
        });

        // Auto-submit when 6 digits are entered
        otpInput.addEventListener('input', () => {
            if (otpInput.value.length === 6) {
                setTimeout(() => {
                    if (validateForm()) {
                        form.dispatchEvent(new Event('submit'));
                    }
                }, 300);
            }
        });

        form.addEventListener('submit', (e) => {
            if (!validateForm()) {
                e.preventDefault();
                return false;
            }
            
            verifyBtn.disabled = true;
            btnText.style.display = 'none';
            loadingSpinner.style.display = 'inline-block';
        });

        // Check for URL parameters to show errors
        const urlParams = new URLSearchParams(window.location.search);
        const error = urlParams.get('error');
        if (error) {
            const errorMessage = document.getElementById('errorMessage');
            let message = '';
            
            switch(error) {
                case 'invalid_otp':
                    message = 'Invalid OTP code. Please try again.';
                    break;
                case 'expired_otp':
                    message = 'OTP has expired. Please request a new one.';
                    break;
                case 'no_otp_session':
                    message = 'No OTP session found. Please request a new OTP.';
                    break;
                default:
                    message = 'An error occurred. Please try again.';
            }
            
            errorMessage.textContent = message;
            errorMessage.style.display = 'block';
        }

        // Focus on OTP input when page loads
        window.addEventListener('load', () => {
            otpInput.focus();
        });
    </script>
</body>
</html>
